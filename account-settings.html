<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pownce Pins | Account Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="content-page">
    <main class="page shell">
      <section class="section panel account-settings-panel">
        <a class="small-btn" href="index.html">Back to Store</a>
        <h1>Account Settings</h1>
        <p id="accountEmail" class="lead">Checking your session...</p>
        <button id="accountLogout" class="btn btn-primary">Log Out</button>
        <p id="accountMessage" class="lead" role="status"></p>
      </section>
    </main>
    <script type="module" src="supabaseClient.js"></script>
    <script>
      const email = document.querySelector('#accountEmail');
      const logout = document.querySelector('#accountLogout');
      const message = document.querySelector('#accountMessage');

      async function loadAccount() {
        const { data } = await window.supabase.auth.getSession();
        if (!data.session) {
          window.location.replace('login-signup.html');
          return;
        }
        email.textContent = `Signed in as ${data.session.user.email}`;
      }

      logout.addEventListener('click', async () => {
        const { error } = await window.supabase.auth.signOut();
        if (error) {
          message.textContent = error.message;
          return;
        }
        window.location.replace('index.html');
      });

      window.addEventListener('load', loadAccount);
    </script>
  </body>
</html>
