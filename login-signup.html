<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pownce Pins – Login / Signup</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { min-height: 100vh; font-family: 'Nunito', Arial, sans-serif; background: linear-gradient(145deg, #fff7fb 0%, #fff 55%, #ffe8f4 100%); margin: 0; display: grid; place-items: center; padding: 1.5rem; }
    .auth-site-header { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 0.5rem clamp(1rem, 4vw, 3rem); background: rgba(255, 255, 255, 0.9); border-bottom: 3px solid #1f1f24; z-index: 2; }
    .auth-brand img { width: 58px; height: 58px; object-fit: contain; }
    .auth-home-link { color: #df3e8d; font-family: 'Digitalt', 'Nunito', sans-serif; font-size: 1rem; border: 2px solid #ff4fa6; border-radius: 999px; padding: 0.55rem 0.9rem; }
    .auth-container { width: min(100%, 430px); background: rgba(255, 255, 255, 0.94); border: 3px solid #1f1f24; border-radius: 24px; box-shadow: 8px 8px 0 rgba(255, 79, 166, 0.55); padding: 2.25rem 2rem; }
    .auth-container::before { content: 'POWNCE PINS'; display: block; color: #ff4fa6; font-family: 'Digitalt', 'Nunito', sans-serif; font-size: 1.3rem; letter-spacing: 0.08em; text-align: center; margin-bottom: 0.5rem; }
    .auth-container h2 { margin: 0 0 1.5rem; text-align: center; color: #1f1f24; font-family: 'Digitalt', 'Nunito', sans-serif; font-size: 2rem; letter-spacing: 0.04em; }
    .auth-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; border-bottom: 2px solid #f2d6e5; }
    .auth-tab { flex: 1; padding: 0.75rem 0; text-align: center; cursor: pointer; color: #77717a; font-family: 'Digitalt', 'Nunito', sans-serif; font-size: 1.05rem; transition: color 0.2s, border 0.2s; border-bottom: 4px solid transparent; }
    .auth-tab.active { border-bottom-color: #ff4fa6; color: #df3e8d; }
    .auth-form { display: flex; flex-direction: column; gap: 1rem; }
    .auth-form input { padding: 0.85rem 1rem; border: 2px solid #eadbe4; border-radius: 12px; font-size: 1rem; color: #1f1f24; background: #fff; transition: border-color 0.2s, box-shadow 0.2s; }
    .auth-form input:focus { outline: none; border-color: #ff4fa6; box-shadow: 0 0 0 4px rgba(255, 79, 166, 0.14); }
    .auth-form button { padding: 0.85rem; background: linear-gradient(135deg, #ff4fa6, #df3e8d); color: #fff; border: 0; border-radius: 999px; font-family: 'Digitalt', 'Nunito', sans-serif; font-size: 1.05rem; cursor: pointer; box-shadow: 0 8px 18px rgba(255, 79, 166, 0.24); transition: transform 0.2s, box-shadow 0.2s; }
    .auth-form button:hover { transform: translateY(-1px); box-shadow: 0 10px 22px rgba(255, 79, 166, 0.32); }
    .divider { text-align: center; color: #9a8d95; margin: 0.5rem 0 0; font-size: 0.9rem; }
    .google-btn { background: #fff !important; color: #39343a !important; border: 2px solid #eadbe4 !important; box-shadow: none !important; display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .google-btn:hover { border-color: #ff4fa6 !important; }
    .google-btn img { width: 20px; height: 20px; }
    .auth-message { text-align: center; margin-top: 1rem; color: #d12462; font-weight: 700; line-height: 1.45; }
    @media (max-width: 500px) { body { padding: 5.5rem 0.75rem 0.75rem; } .auth-site-header { padding: 0.35rem 0.75rem; } .auth-brand img { width: 48px; height: 48px; } .auth-container { padding: 1.75rem 1.25rem; } }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
  <body>
  <header class="auth-site-header">
    <a href="index.html" class="auth-brand" aria-label="Pownce Pins home">
      <img src="assets/pins/Logo.png" alt="Pownce Pins" />
    </a>
    <a href="index.html" class="auth-home-link">Back to Store</a>
  </header>
  <div class="auth-container">
    <div class="auth-tabs">
      <div class="auth-tab active" id="login-tab">Login</div>
      <div class="auth-tab" id="signup-tab">Sign Up</div>
    </div>
    <form class="auth-form" id="login-form">
      <input type="email" id="login-email" placeholder="Email" required autocomplete="username">
      <input type="password" id="login-password" placeholder="Password" required autocomplete="current-password">
      <button type="submit">Login</button>
      <div class="divider">or</div>
      <button type="button" class="google-btn" id="google-login">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">Sign in with Google
      </button>
    </form>
    <form class="auth-form" id="signup-form" style="display:none;">
      <input type="email" id="signup-email" placeholder="Email" required autocomplete="username">
      <input type="password" id="signup-password" placeholder="Password" required autocomplete="new-password">
      <button type="submit">Sign Up</button>
      <div class="divider">or</div>
      <button type="button" class="google-btn" id="google-signup">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google">Sign up with Google
      </button>
    </form>
    <div class="auth-message" id="auth-message"></div>
  </div>
  <script>
    // Supabase config
    const supabaseUrl = 'https://hszukdjgqrjkbuxcjbud.supabase.co';
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzenVrZGpncXJqa2J1eGNqYnVkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzMzM0NjUsImV4cCI6MjA4ODkwOTQ2NX0.H4qR-S4b_e-DuPLHhJR9qiJasaVokXDz1RCyu2JN_Cc';
    const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
    const authRedirect = `${window.location.origin}${window.location.pathname}`;

    supabaseClient.auth.getSession().then(({ data }) => {
      if (data.session) {
        window.location.replace('index.html');
      }
    });

    // Tab switching
    const loginTab = document.getElementById('login-tab');
    const signupTab = document.getElementById('signup-tab');
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const authMessage = document.getElementById('auth-message');

    loginTab.onclick = () => {
      loginTab.classList.add('active');
      signupTab.classList.remove('active');
      loginForm.style.display = '';
      signupForm.style.display = 'none';
      authMessage.textContent = '';
    };
    signupTab.onclick = () => {
      signupTab.classList.add('active');
      loginTab.classList.remove('active');
      signupForm.style.display = '';
      loginForm.style.display = 'none';
      authMessage.textContent = '';
    };

    // Login
    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      authMessage.textContent = '';
      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        authMessage.style.color = '#e74c3c';
        if (error.message && error.message.toLowerCase().includes('invalid login credentials')) {
          authMessage.innerHTML = 'Invalid login credentials.<br>If you registered with Google, please use <b>Sign in with Google</b>.';
        } else {
          authMessage.textContent = error.message;
        }
      } else {
        authMessage.style.color = '#27ae60';
        authMessage.textContent = 'Login successful! Redirecting...';
        setTimeout(() => window.location.href = 'index.html', 1200);
      }
    };

    // Signup
    signupForm.onsubmit = async (e) => {
      e.preventDefault();
      authMessage.textContent = '';
      const email = document.getElementById('signup-email').value;
      const password = document.getElementById('signup-password').value;
      
      // Validate password strength
      if (password.length < 6) {
        authMessage.style.color = '#e74c3c';
        authMessage.textContent = 'Password must be at least 6 characters.';
        return;
      }
      
      const { data, error } = await supabaseClient.auth.signUp({ email, password });
      console.log('Signup response:', { data, error }); // Debug log
      if (error) {
        authMessage.style.color = '#e74c3c';
        if (error.message && error.message.toLowerCase().includes('user already registered')) {
          authMessage.innerHTML = 'This email is already registered.<br>If you signed up with Google, please use <b>Sign in with Google</b>.';
        } else {
          authMessage.textContent = error.message || JSON.stringify(error);
        }
      } else if (data.session) {
        authMessage.style.color = '#27ae60';
        authMessage.textContent = 'Signup successful! Redirecting...';
        setTimeout(() => window.location.href = 'index.html', 700);
      } else {
        // Try to sign in to detect if the account is already registered (esp. with OAuth)
        const { error: signInError } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (signInError && signInError.message && signInError.message.toLowerCase().includes('invalid login credentials')) {
          authMessage.style.color = '#e74c3c';
          authMessage.innerHTML = 'This email is already registered.<br>If you signed up with Google, please use <b>Sign in with Google</b>.';
        } else {
          // Switch to login tab and show message
          loginTab.classList.add('active');
          signupTab.classList.remove('active');
          loginForm.style.display = '';
          signupForm.style.display = 'none';
          authMessage.style.color = '#27ae60';
          authMessage.textContent = 'Signup successful! Please check your email to confirm, then log in.';
        }
      }
    };

    // Google login/signup (attach after DOM loaded, prevent default)
    function attachGoogleHandlers() {
      console.log('Attaching Google handlers. Supabase:', typeof window.supabase, 'Client:', typeof supabaseClient);
      document.getElementById('google-login').addEventListener('click', async (e) => {
        e.preventDefault();
        console.log('Google login button clicked');
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: authRedirect
          }
        });
        if (error) authMessage.textContent = error.message;
      });
      document.getElementById('google-signup').addEventListener('click', async (e) => {
        e.preventDefault();
        console.log('Google signup button clicked');
        const { error } = await supabaseClient.auth.signInWithOAuth({
          provider: 'google',
          options: {
            redirectTo: authRedirect
          }
        });
        if (error) authMessage.textContent = error.message;
      });
    }
    // Attach after DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', attachGoogleHandlers);
    } else {
      attachGoogleHandlers();
    }
  </script>
</body>
</html>
